<app-auth-shell title="Redefinir senha" subtitle="Enviaremos um link para você criar uma nova senha." back="/login">
    @if (sent()) {
    <p class="notice">
        Se o e-mail estiver cadastrado, enviamos um link para redefinir a senha.
        O link vale por 30 minutos.
    </p>
    <a class="btn btn--dark" routerLink="/login">Voltar para o login</a>
    } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field">
            <label class="field__label" for="email">E-mail da conta</label>
            <input id="email" class="input" type="email" formControlName="email" autocomplete="email" inputmode="email"
                placeholder="voce@email.com" [attr.aria-invalid]="show('email') ? 'true' : null" />
            @if (show('email')) {
            <p class="field__error">Informe um e-mail válido.</p>
            }
        </div>

        @if (error()) {
        <p class="form-error" role="alert">{{ error() }}</p>
        }

        <button class="btn btn--dark" type="submit" [disabled]="loading()">
            {{ loading() ? 'Enviando…' : 'Enviar link' }}
        </button>
    </form>
    }
</app-auth-shell>
