<app-auth-shell title="Entrar" subtitle="Agende serviços e acompanhe seus pets.">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label class="field__label" for="email">E-mail</label>
      <input id="email" class="input" type="email" formControlName="email" autocomplete="email" inputmode="email"
        placeholder="voce@email.com" [attr.aria-invalid]="show('email') ? 'true' : null" />
      @if (show('email')) {
      <p class="field__error">Informe um e-mail válido.</p>
      }
    </div>

    <div class="field">
      <label class="field__label" for="password">Senha</label>
      <input id="password" class="input" type="password" formControlName="password" autocomplete="current-password"
        placeholder="Sua senha" [attr.aria-invalid]="show('password') ? 'true' : null" />
      @if (show('password')) {
      <p class="field__error">Informe sua senha.</p>
      }
    </div>

    @if (error()) {
    <p class="form-error" role="alert">{{ error() }}</p>
    }

    <button class="btn btn--dark" type="submit" [disabled]="loading()">
      {{ loading() ? 'Entrando…' : 'Entrar' }}
    </button>

    <a class="link center forgot" routerLink="/forgot-password">Esqueci minha senha</a>

    <hr class="divider" />

    <a class="btn btn--light" routerLink="/register">Criar conta</a>
  </form>
</app-auth-shell>
