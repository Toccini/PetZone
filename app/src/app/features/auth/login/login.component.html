<ion-content class="ion-padding">
  <div class="container">
    <h1>PetShop 🐾</h1>
    <p class="subtitle">Entre na sua conta</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <ion-input
        label="E-mail" labelPlacement="floating" fill="outline"
        type="email" formControlName="email" autocomplete="email"
      ></ion-input>

      <ion-input
        label="Senha" labelPlacement="floating" fill="outline"
        type="password" formControlName="password" autocomplete="current-password"
      ></ion-input>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <ion-button expand="block" type="submit" [disabled]="loading()">
        @if (loading()) { <ion-spinner name="dots"></ion-spinner> } @else { Entrar }
      </ion-button>
    </form>

    <div class="links">
      <a routerLink="/forgot-password">Esqueci minha senha</a>
      <a routerLink="/register">Criar conta</a>
    </div>
  </div>
</ion-content>
